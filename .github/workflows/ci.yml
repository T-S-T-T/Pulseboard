name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Integration tests start PostgreSQL with Testcontainers.
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 3s
          --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      APP_DB_PASSWORD: ci_only_password
      DATABASE_URL: postgres://pulseboard_app:ci_only_password@127.0.0.1:5432/postgres
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build -d --wait db api web
      - name: Smoke test through the web app
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000/api/ready
      - name: Validate the production configuration
        env:
          DOMAIN: example.com
          POSTGRES_PASSWORD: placeholder
          APP_DB_PASSWORD: placeholder
        run: docker compose -f docker-compose.prod.yml config --quiet
      - if: failure()
        run: docker compose logs
